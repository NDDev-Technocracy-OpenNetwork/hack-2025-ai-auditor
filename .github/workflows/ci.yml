name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python)
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/python-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      uv_version: "0.12.23"
      python_version: '3.11'
      working_directory: backend
      install_command: 'uv pip install -r requirements.txt ruff pytest'
      test_command: ".venv/bin/ruff check . && .venv/bin/python -m pytest -q"

  frontend:
    name: frontend (node)
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/node-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      package_manager: npm
      node_version: "24.21.0"
      npm_version: "11.19.0"
      working_directory: frontend
      install_command: 'npm ci --no-audit'
      test_command: ".venv/bin/ruff check . && .venv/bin/python -m pytest -q"

  codeql:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/public-codeql.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      languages: '["python","javascript","actions"]'

  scorecard:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/public-scorecard.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  dependency-review:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  zizmor:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/zizmor-sarif.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  secret-scan:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  actionlint:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/actionlint.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  semgrep:
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/semgrep-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
